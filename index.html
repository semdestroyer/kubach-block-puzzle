<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Block Puzzle - Minecraft Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="base-pallete.css">
  <script src="https://yandex.ru/games/sdk/v2/ysdk.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Press Start 2P', monospace;
      background: #C6C6C6;
      color: #ffffff;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 500px;
      margin: 0 auto;
      background: #1a1a1a;
    }

    #game-canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(26, 26, 26, 0.98);
      z-index: 10;
    }

    .title {
      font-size: 28px;
      color: #6EA84D;
      text-shadow: 3px 3px 0 #5D8C3E, 6px 6px 0 #2a2a2a;
      margin-bottom: 10px;
      text-align: center;
    }

    .subtitle {
      font-size: 12px;
      color: #9C6B3A;
      margin-bottom: 40px;
    }

    .btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      padding: 15px 30px;
      margin: 8px;
      border: 4px solid #2D2D2D;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .btn:active {
      transform: translate(2px, 2px);
    }

    .btn-primary {
      background: #6EA84D;
      color: #ffffff;
      box-shadow: 0 4px 0 #5D8C3E;
    }

    .btn-primary:active {
      box-shadow: 0 2px 0 #5D8C3E;
    }

    .btn-back {
      background: #757575;
      color: #ffffff;
      box-shadow: 0 4px 0 #555555;
    }

    .btn-back:active {
      box-shadow: 0 2px 0 #555555;
    }

    .best-scores {
      margin-top: 40px;
      text-align: center;
    }

    .best-scores h3 {
      font-size: 10px;
      color: #FFC107;
      margin-bottom: 15px;
    }

    .scores-list {
      font-size: 8px;
      color: #aaaaaa;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin: 5px 0;
    }

    .select-size-screen h2 {
      font-size: 16px;
      margin-bottom: 30px;
      color: #8A8A8A;
    }

    .size-buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
      max-width: 250px;
    }

    .btn-size {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #4a4a4a;
      color: #ffffff;
      box-shadow: 0 4px 0 #333333;
      padding: 20px;
    }

    .btn-size .best {
      font-size: 8px;
      color: #FFC107;
      margin-top: 8px;
    }

    .gameover-screen h2 {
      font-size: 20px;
      color: #FF4444;
      margin-bottom: 30px;
    }

    .final-score, .lines-cleared {
      font-size: 14px;
      margin: 10px 0;
    }

    .final-score .value, .lines-cleared .value {
      color: #FFC107;
      margin-left: 10px;
    }

    .new-best {
      font-size: 16px;
      color: #50C878;
      margin: 20px 0;
      animation: pulse 0.5s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.1); }
    }

    @media (min-width: 600px) {
      #game-container {
        border-left: 2px solid #333333;
        border-right: 2px solid #333333;
      }
    }

    .loading-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
      z-index: 100;
    }

    .loading-screen .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #333;
      border-top-color: #6EA84D;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .loading-screen p {
      margin-top: 20px;
      font-size: 10px;
      color: #666;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="loading-screen" class="loading-screen">
      <div class="spinner"></div>
      <p>Loading...</p>
    </div>
    <canvas id="game-canvas"></canvas>
  </div>
  <script type="module" src="src/game.js"></script>
</body>
</html>
